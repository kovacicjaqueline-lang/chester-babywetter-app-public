name: Outfit engine temporary verification

on:
  push:
    branches:
      - feat/outfit-rules

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Syntax check
        run: |
          for file in src/*.js test/*.js; do node --check "$file"; done
      - name: Pure engine guard
        run: |
          if grep -R -n -E 'document\.|window\.|localStorage|sessionStorage|navigator\.geolocation|fetch\(' src; then
            echo 'Unexpected UI/storage/network access in pure engine source'
            exit 1
          fi
