name: Outfit Engine Temporary Verification

on:
  push:
    branches:
      - feat/outfit-rules
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit tests
        run: npm test
      - name: Syntax checks
        run: |
          for file in src/*.js test/*.js; do
            node --check "$file"
          done
      - name: Pure-engine boundary scan
        run: |
          if grep -R -n -E '\b(document|fetch|XMLHttpRequest|localStorage|sessionStorage)\b|navigator\.geolocation' src; then
            echo 'Forbidden DOM/network/storage access found in engine source.'
            exit 1
          fi
